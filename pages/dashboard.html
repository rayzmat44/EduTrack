<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduTrack Uganda - Dashboard</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>

    <div class="sidebar">
  <h2>EduTrack</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="students.html">Students</a>
    <a href="attendance.html">Attendance</a>
    <a href="fees.html">Fees</a>
    <a href="exams.html">Exams</a>
    <a href="teachers.html">Teachers</a>
    <a href="settings.html">Settings</a>
  </nav>
  <button id="logoutBtn">Logout</button>
</div>

<div class="main-content">
  <div class="topbar">
    <h3>Dashboard</h3>
    <p>Logged in as: <strong id="userEmail"></strong></p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h4>Total Students</h4>
      <p class="stat-number">0</p>
    </div>
    <div class="stat-card">
      <h4>Teachers</h4>
      <p class="stat-number">0</p>
    </div>
    <div class="stat-card">
      <h4>Fees Collected</h4>
      <p class="stat-number">UGX 0</p>
    </div>
    <div class="stat-card">
      <h4>Attendance Today</h4>
      <p class="stat-number">0%</p>
    </div>
  </div>
</div>

   
<script src="../js/supabase.js"></script>
<script>

  async function checkSession() {
    const { data } = await db.auth.getSession()

    if (!data.session) {
      window.location.href = 'index.html'
    }
  }


  checkSession()
  async function getUser() {
    const {data} = await db.auth.getUser()
    document.getElementById('userEmail').textContent = data.user.email
  }
  getUser()

  async function loadStats() {
  const { count } = await db
    .from('students')
    .select('*', { count: 'exact', head: true })

  document.querySelectorAll('.stat-number')[0].textContent = count

  const { data } = await db.from('fees').select('amount')

  const total = data.reduce((sum, row) => sum + Number(row.amount), 0)
  document.querySelectorAll('.stat-number')[2].textContent = 'UGX ' + total.toLocaleString()

  const { count: teacherCount } = await db
  .from('teachers')
  .select('*', { count: 'exact', head: true })

document.querySelectorAll('.stat-number')[1].textContent = teacherCount
}

loadStats()
</script>
  </body>
</html>
